[project]
name = "ai-refusal-map"
version = "0.1.0"
description = "Reproducible research tools for studying assistant response behavior."
requires-python = ">=3.12"
dependencies = [
  "duckdb",
  "fastapi",
  "pydantic-settings",
  "uvicorn[standard]",
  "datasets",
  "polars",
  "pyarrow",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps/api", "research", "tests"]
