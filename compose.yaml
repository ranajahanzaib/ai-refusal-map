services:
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ARM_DATA_DIR: /app/data/processed
      ARM_ANNOTATION_DB: /app/data/annotations.sqlite3
      ARM_DUCKDB_FILE: /app/data/analysis.duckdb
    volumes:
      - ./data:/app/data
